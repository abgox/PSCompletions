name: Check Completion

on:
  pull_request_target:
    types: [opened, synchronize]

concurrency:
  group: check-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Completion
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MARKER: "<!-- bot:check-completion -->"
      # RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Find or create comment
        id: comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = process.env.PR_NUMBER
            const marker = process.env.MARKER
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100
            })

            let comment = comments.data.find(c => c.body?.includes(marker) && c.user?.type === "Bot")

            const body = `${marker}

            ⏳ Checking...
            `

            if (comment) {
              core.setOutput("comment_id", comment.id)
            } else {
              const res = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body
              })
              core.setOutput("comment_id", res.data.id)
            }

      - name: Checkout base
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 50

      - name: Inject completion index
        run: |
          git -C ./base fetch origin index --depth 1
          git -C ./base show origin/index:completions.json > ./base/completions.json

      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 50
          allow-unsafe-pr-checkout: true

      # The gates come from the default branch, not from the PR base: a fix to these scripts has to apply to every open PR, and a base recorded weeks ago would otherwise pin an old gate forever.
      # Still trusted: on pull_request_target the default branch is the one ref this job never takes from the PR.
      - name: Use trusted scripts
        shell: pwsh
        run: |
          git -C base fetch --depth 1 origin ${{ github.event.repository.default_branch }}
          git -C base checkout FETCH_HEAD -- scripts
          Write-Host "gate scripts from $(git -C base rev-parse --short FETCH_HEAD)"
          Remove-Item -Path pr/scripts -Recurse -Force
          Copy-Item -Path base/scripts -Destination pr -Recurse -Force

      # Hard dependency of validate-completion.ps1.
      # traverse 1.15.1 (2026-10-16) walks boolean subschemas, so the CLI's `'$ref' in schema` throws on our legal `additionalProperties: false` and the crash is reported as a schema defect: pin the last good one until the CLI guards that.
      - name: Install JSON Schema validator
        shell: pwsh
        run: |
          npm install --global '@jirutka/ajv-cli@6.0.0' '@json-schema-tools/traverse@1.15.0'
          $walk = Join-Path (npm root -g) '@json-schema-tools/traverse/package.json'
          $version = if (Test-Path $walk) { (Get-Content $walk -Raw | ConvertFrom-Json).version } else { 'unknown' }
          Write-Host "ajv-cli $(ajv --version) · traverse $version"

      - name: Check Completion
        shell: pwsh
        working-directory: pr
        run: ./scripts/check-completion.ps1

      # Runs on failure too, so the report reaches the PR instead of leaving the comment on "Checking...".
      # Only a cancelled run is skipped: with cancel-in-progress, a superseded run must not overwrite the newer comment.
      - name: Comment PR
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = await import('node:fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const report = 'pr/result.md';
            const missing = `${process.env.MARKER}\n\n## Completion check\n\nThe check failed before writing a report. See the [job log](${runUrl}).\n`;
            const body = `${(fs.existsSync(report) ? fs.readFileSync(report, 'utf8') : missing).trimEnd()}\n\n---\n\n[Job log](${runUrl})\n`;
            const commentId = '${{ steps.comment.outputs.comment_id }}';
            const base = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (commentId) {
              await github.rest.issues.updateComment({ ...base, comment_id: Number(commentId) });
            } else {
              await github.rest.issues.createComment({ ...base, issue_number: Number(process.env.PR_NUMBER) });
            }

      - name: Check rate limit
        shell: pwsh
        run: |
          # Check rate limit
          $headers = @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              Accept        = 'application/vnd.github.v3+json'
          }
          try {
              $response = Invoke-RestMethod -Uri 'https://api.github.com/rate_limit' -Headers $headers
              Write-Output $response.rate
          }
          catch {
              Write-Output 'Failed to check rate limit'
          }
