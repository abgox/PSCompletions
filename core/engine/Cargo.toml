[package]
name = "psc-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PSCompletions completion engine + interactive menu (psc-menu). No network deps — stays lean for the per-keystroke hot path."

[lib]
name = "psc_engine"
path = "src/lib.rs"

[[bin]]
name = "psc-menu"
path = "src/bin/psc-menu.rs"

[dependencies]
psc-common = { path = "../common" }
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
yaml_serde = "0.10"
time = { version = "0.3", features = ["local-offset", "formatting"] }
unicode-width = "0.2"
mlua = { version = "0.12", features = ["vendored", "lua55"] }
glob = "0.3"
