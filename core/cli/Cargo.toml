[package]
name = "psc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PSCompletions CLI (psc). Platform-agnostic; carries network (reqwest) for add/update."

[lib]
name = "psc_cli"
path = "src/lib.rs"

[[bin]]
name = "psc"
path = "src/bin/psc.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
